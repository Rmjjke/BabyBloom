# Stream B walk (en, light): the ten-page onboarding, the permission dialog
# raised ON the notifications page, and the Dashboard reached with the greeting
# readable.
#
# Page order (reordered 2026-09-01): Welcome → Name → Birth → Feeding → Growth
# → Fact → Notifications → Widget → Generating → Premium. The commitment CTA
# "Build My Tracker" now lives on the WIDGET page, immediately before the
# loader it kicks off; the Fact page ends with a plain "Next".
#
# This flow is a SMOKE CHECK, not the regression guard for the old
# dialog-over-Dashboard bug. It cannot be that guard: the same XCUITest driver
# that auto-answers the alert on the notifications page would dismiss a
# Dashboard alert too, before the greeting assertion ever ran. The guard is
# static —
#
#     grep -rn requestPermission --include=*.swift
#
# must return exactly two hits: the declaration in NotificationManager.swift
# and the single call site in NotificationsPage.swift. A third hit is the
# regression.
#
# Traps honoured: waitForAnimationToEnd never settles (the shared backdrop
# drifts forever) — explicit anchors only; hideKeyboard on the Name page
# advances a page — pressKey: Enter instead; and the system alert is
# auto-answered by the XCUITest driver ~3s after it appears, so the flow waits
# for the NEXT page rather than tapping "Allow" itself.
appId: com.nenita.app
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      "-BBSkipSplash": "true"
      "-appLanguage": "en"
      "-appAppearance": "light"

- extendedWaitUntil: { visible: "Start", timeout: 20000 }
- tapOn: "Start"
# The page transition is 0.3s of animation on top of a fresh render; on a
# loaded machine the field is not in the hierarchy yet when the tap fires.
- extendedWaitUntil: { visible: "Baby's name", timeout: 20000 }
- tapOn: "Baby's name"
- inputText: "Mia"
- pressKey: Enter
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Next"

# Fact page — its CTA is now a plain "Next" too, so anchor on the page's own
# badge before tapping, or the count of "Next" taps stops meaning anything.
- extendedWaitUntil: { visible: "Did you know?", timeout: 20000 }
- takeScreenshot: 00-fact-en-light
- tapOn: "Next"

- extendedWaitUntil: { visible: "Turn on notifications", timeout: 30000 }
- assertVisible: ".*Mia eats and sleeps.*"
- assertVisible: ".*learns your rhythm.*"
- assertVisible: ".*wake window.*"
- assertVisible: ".*No spam.*"
- assertVisible: "Not now"
- takeScreenshot: 01-notify-en-light

- tapOn: "Turn on notifications"
- takeScreenshot: 02-after-cta-auto-advanced-en-light

# The alert is answered by the driver; the page advances on the callback.
- extendedWaitUntil: { visible: "The widget on your Home Screen", timeout: 25000 }
- assertVisible: "Mia"
- assertVisible: "Feeding in"
- assertVisible: ".*40 min.*"
- assertVisible: ".*Touch and hold the Home Screen.*Bitty.*"
- assertVisible: "Build My Tracker"
- takeScreenshot: 03-widget-en-light
- tapOn: "Build My Tracker"

# Generating runs here — self-advancing, ~5s — and lands DIRECTLY on the
# paywall. Do not assert the loader itself: it is on screen for about as long
# as a single hierarchy query takes on a loaded machine, so any assertion on it
# is a coin flip. Instead, the assertNotVisible below is the discriminator: the
# loader's ≥4s presence means a build that skipped straight from the widget
# page to the paywall (Generating never ran) would still be caught here, right
# after the tap, before the paywall has had time to arrive on its own.
- assertNotVisible: "Bitty Premium"
- extendedWaitUntil: { visible: "Bitty Premium", timeout: 40000 }
- takeScreenshot: 04-premium-en-light
- extendedWaitUntil: { visible: "Close", timeout: 20000 }
- tapOn: "Close"

# The regression guard: the greeting is readable the instant the Dashboard
# arrives, with no permission alert over it.
- extendedWaitUntil: { visible: { id: "tab_home" }, timeout: 20000 }
- assertVisible: "Welcome to Bitty"
- assertVisible: "Mia"
- assertNotVisible: "Allow"
- assertNotVisible: "Don't Allow"
- takeScreenshot: 05-dashboard-no-dialog-en-light
