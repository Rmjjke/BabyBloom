# AC4 — the free history window, on the Events list.
#
# One screen stands in for five. Feeding / Sleep / Diapers / Events / Recent
# activity all render the SAME `BBLockedHistoryFooter` off the same
# `HistoryWindow.split`, and the other four are 150-row Month lists that take
# minutes to scroll to the bottom. Events is capped at twenty rows, so the
# footer is a dozen scrolls from the top — the same assertion for a fraction of
# the runtime. The boundary arithmetic itself lives in `HistoryWindowTests`.
#
# `showcase` is the fixture because it is the only seed that logs past the
# window: 21 days of entries against a 15-day window, so 6 days sit behind the
# lock. `healthy` spans 9 days and would show NOTHING hidden — which is the
# negative case the second half of this flow proves with -BBForcePremium.
appId: com.nenita.app
tags: [regression]
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      "-BBSkipSplash": "true"
      "-hasCompletedOnboarding": "true"
      "-appLanguage": "en"
      "-appAppearance": "light"
      "-BBSeedScenario": "showcase"
- extendedWaitUntil:
    visible:
      id: "tab_home"
    timeout: 15000
- tapOn:
    text: "More"
    childOf:
      text: "Tab Bar"
- extendedWaitUntil:
    visible:
      id: "tab_more"
    timeout: 10000
- tapOn: "Events"
- repeat:
    times: 12
    commands:
      - scroll
- assertVisible: "Showing the last 15 days"
- assertVisible: "Full history is in Premium"

# The whole row sells — this is the only entry point the window offers.
- tapOn: "Showing the last 15 days"
- extendedWaitUntil:
    visible: "Unlimited tracking history"
    timeout: 10000
# The promise the window exists to make true is on the paywall it opens; the
# line that promised a second child profile is gone from it.
- assertNotVisible: "Multiple children profiles"
- swipe:
    start: "50%,20%"
    end: "50%,95%"
- extendedWaitUntil:
    visible: "Events"
    timeout: 10000

# Same fixture, same screen, entitlement on: no lock anywhere.
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      "-BBSkipSplash": "true"
      "-hasCompletedOnboarding": "true"
      "-appLanguage": "en"
      "-appAppearance": "light"
      "-BBSeedScenario": "showcase"
      "-BBForcePremium": "true"
- extendedWaitUntil:
    visible:
      id: "tab_home"
    timeout: 15000
- tapOn:
    text: "More"
    childOf:
      text: "Tab Bar"
- extendedWaitUntil:
    visible:
      id: "tab_more"
    timeout: 10000
- tapOn: "Events"
- repeat:
    times: 12
    commands:
      - scroll
- assertNotVisible: "Showing the last 15 days"
