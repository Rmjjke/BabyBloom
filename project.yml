name: BabyBloom
options:
  bundleIdPrefix: com.nenita
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  SWIFT_VERSION: 6.0
  MARKETING_VERSION: 1.0.0
  CURRENT_PROJECT_VERSION: 4
  # Project-wide so the widget extension and the test bundle sign under the
  # same team as the app. Automatic signing fails on the .appex without it.
  DEVELOPMENT_TEAM: 6T959D75QM

targets:
  BabyBloom:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BabyBloom
        excludes:
          - "**/.DS_Store"
    resources:
      - path: BabyBloom/Resources/Assets.xcassets
      - path: BabyBloom/Resources/Localization
        buildPhase: resources
    preBuildScripts:
      - name: "Verify widget localization copies in sync"
        basedOnDependencyAnalysis: false
        script: |
          cd "$PROJECT_DIR"
          # Keep this list in sync with LocalizationManager.SupportedLanguage.
          for f in en ru es; do
            if ! cmp -s "BabyBloom/Resources/Localization/$f.json" "WidgetResources/Localization/$f.json"; then
              echo "error: WidgetResources/Localization/$f.json is out of sync with BabyBloom/Resources/Localization/$f.json. Run: cp BabyBloom/Resources/Localization/$f.json WidgetResources/Localization/$f.json"
              exit 1
            fi
          done
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nenita.app
      INFOPLIST_FILE: BabyBloom/Resources/Info.plist
      DEVELOPMENT_TEAM: 6T959D75QM
      SWIFT_VERSION: 6.0
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEW_CONTENT: YES
      CODE_SIGN_STYLE: Automatic
    entitlements:
      path: BabyBloom/Resources/BabyBloom.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nenita.app
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.nenita.app
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - target: BabyBloomWidget
        embed: true

  BabyBloomWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BabyBloomWidget
        excludes:
          - "**/.DS_Store"
      - path: BabyBloom/Core/Models
        excludes:
          - "**/.DS_Store"
      - path: BabyBloom/Core/Localization
        excludes:
          - "**/.DS_Store"
      # The next-feed arithmetic the widget counts down to. Pure, and shared
      # with the app so the widget and the feeding reminder cannot disagree.
      - path: BabyBloom/Core/Feeding
        excludes:
          - "**/.DS_Store"
      # The widget's own views live in the APP's source tree so the app target
      # compiles them too — that is what lets BabyBloomTests render them per
      # locale via @testable import. Same arrangement as Core/Models above.
      - path: BabyBloom/Features/Widget
        excludes:
          - "**/.DS_Store"
      # Separate physical copy of the localization JSONs (kept in sync with
      # BabyBloom/Resources/Localization). This MUST live in `sources` with
      # buildPhase: resources — XcodeGen has no target-level `resources` key,
      # build phases are driven purely by the `sources` scan. A DISTINCT path
      # outside any other scanned source root is required so XcodeGen does not
      # dedupe the file references with the app target; otherwise the .appex
      # gets NO Resources build phase and the widget renders raw i18n keys.
      - path: WidgetResources/Localization
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nenita.app.widget
      INFOPLIST_FILE: BabyBloomWidget/Info.plist
      SWIFT_VERSION: 6.0
      CODE_SIGN_STYLE: Automatic
    entitlements:
      path: BabyBloomWidget/BabyBloomWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nenita.app
    dependencies: []

  BabyBloomTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BabyBloomTests
        excludes:
          - "**/.DS_Store"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nenita.app.tests
      SWIFT_VERSION: 6.0
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BabyBloom

# Top level, a sibling of `targets:`. This block used to sit inside the
# BabyBloom target, where XcodeGen silently ignores it — schemes were being
# created implicitly by Xcode instead, so nothing here took effect.
schemes:
  BabyBloom:
    build:
      targets:
        BabyBloom: all
    run:
      config: Debug
      # Local StoreKit products so the paywall renders on the simulator, where
      # there is no App Store Connect to fetch them from.
      storeKitConfiguration: Nenita.storekit
    test:
      config: Debug
      targets:
        - BabyBloomTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
