name: BabyBloom
options:
  bundleIdPrefix: com.nenita
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  SWIFT_VERSION: 6.0
  MARKETING_VERSION: 1.0.1
  CURRENT_PROJECT_VERSION: 23
  # Project-wide so the widget extension and the test bundle sign under the
  # same team as the app. Automatic signing fails on the .appex without it.
  DEVELOPMENT_TEAM: 6T959D75QM

# Remote Swift packages. Pinned EXACTLY — including the two transitive ones
# Amplitude-Swift pulls in with open `from:` ranges: the analytics SDK is a
# privacy surface, and a patch release can change what it collects by default
# (AmplitudeCore owns remote config and diagnostics). A version bump is a
# deliberate change with its source re-read, not a resolve. Only AmplitudeSwift
# is linked; the other two are listed to pin them, same URLs as its manifest.
# Package.resolved (committed) is part of the pin: any diff to it needs the
# same privacy review.
packages:
  AmplitudeSwift:
    url: https://github.com/amplitude/Amplitude-Swift
    exactVersion: 1.19.0
  AmplitudeCore:
    url: https://github.com/amplitude/AmplitudeCore-Swift.git
    exactVersion: 1.5.2
  AnalyticsConnector:
    url: https://github.com/amplitude/analytics-connector-ios.git
    exactVersion: 1.3.3

targets:
  BabyBloom:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BabyBloom
        excludes:
          - "**/.DS_Store"
    resources:
      - path: BabyBloom/Resources/Assets.xcassets
      - path: BabyBloom/Resources/Localization
        buildPhase: resources
    preBuildScripts:
      - name: "Verify widget resource copies in sync"
        basedOnDependencyAnalysis: false
        script: |
          cd "$PROJECT_DIR"
          # Keep this list in sync with LocalizationManager.SupportedLanguage.
          for f in en ru es; do
            if ! cmp -s "BabyBloom/Resources/Localization/$f.json" "WidgetResources/Localization/$f.json"; then
              echo "error: WidgetResources/Localization/$f.json is out of sync with BabyBloom/Resources/Localization/$f.json. Run: cp BabyBloom/Resources/Localization/$f.json WidgetResources/Localization/$f.json"
              exit 1
            fi
          done
          # Same rule for the widget's copy of the brand colorsets. Keep this
          # list in sync with the colorsets WidgetResources/Colors.xcassets holds.
          for c in BBGradientStart BBGradientEnd BBAccent; do
            app="BabyBloom/Resources/Assets.xcassets/Colors/$c.colorset/Contents.json"
            widget="WidgetResources/Colors.xcassets/$c.colorset/Contents.json"
            if ! cmp -s "$app" "$widget"; then
              echo "error: $widget is out of sync with $app. Run: cp \"$app\" \"$widget\""
              exit 1
            fi
          done
      # An archive with no usable Amplitude key would ship analytics OFF (or
      # rejected by Amplitude) without a word. Checks only whether the key is
      # empty, still the Secrets.example.xcconfig placeholder, or not the 32
      # characters an Amplitude key has — and never echoes it. Note xcodebuild
      # itself prints every build setting, the key included, for each script
      # phase, so raw build logs are not shareable.
      - name: "Refuse a Release archive without the Amplitude key"
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            problem=""
            if [ -z "$AMPLITUDE_API_KEY" ]; then
              problem="AMPLITUDE_API_KEY is empty — Config/Secrets.xcconfig missing"
            elif [ "$AMPLITUDE_API_KEY" = "your-amplitude-api-key" ]; then
              problem="AMPLITUDE_API_KEY is still the Secrets.example.xcconfig placeholder"
            elif [ "${#AMPLITUDE_API_KEY}" -ne 32 ]; then
              problem="AMPLITUDE_API_KEY is not 32 characters long"
            fi
            if [ -n "$problem" ]; then
              if [ "$ACTION" = "install" ]; then
                echo "error: $problem; this archive would ship analytics OFF"
                exit 1
              fi
              echo "warning: $problem; this Release build has analytics OFF"
            fi
          fi
    # The Amplitude API key reaches Info.plist as $(AMPLITUDE_API_KEY), and its
    # ONLY source is this xcconfig chain: App.xcconfig (committed, empty
    # default) optionally includes Secrets.xcconfig (gitignored). The key must
    # NOT be added under `settings:` below — a target setting outranks the
    # xcconfig and would silently pin it empty. The repo is public.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nenita.app
      INFOPLIST_FILE: BabyBloom/Resources/Info.plist
      DEVELOPMENT_TEAM: 6T959D75QM
      SWIFT_VERSION: 6.0
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEW_CONTENT: YES
      CODE_SIGN_STYLE: Automatic
    entitlements:
      path: BabyBloom/Resources/BabyBloom.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nenita.app
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.nenita.app
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - target: BabyBloomWidget
        embed: true
      # Product analytics. The APP only: the widget must never link it, and
      # nothing outside Services/Analytics may import it.
      - package: AmplitudeSwift
        product: AmplitudeSwift

  BabyBloomWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BabyBloomWidget
        excludes:
          - "**/.DS_Store"
      - path: BabyBloom/Core/Models
        excludes:
          - "**/.DS_Store"
      - path: BabyBloom/Core/Localization
        excludes:
          - "**/.DS_Store"
      # The next-feed arithmetic the widget counts down to. Pure, and shared
      # with the app so the widget and the feeding reminder cannot disagree.
      - path: BabyBloom/Core/Feeding
        excludes:
          - "**/.DS_Store"
      # The one place WidgetCenter is called from. SeedScenario (in Core/Models
      # above) reloads the widget after replacing the store, and the app tree is
      # not otherwise compiled into this target, so the file is named explicitly.
      - path: BabyBloom/Services/WidgetRefresh.swift
      # The widget's own views live in the APP's source tree so the app target
      # compiles them too — that is what lets BabyBloomTests render them per
      # locale via @testable import. Same arrangement as Core/Models above.
      - path: BabyBloom/Features/Widget
        excludes:
          - "**/.DS_Store"
      # Separate physical copy of the localization JSONs (kept in sync with
      # BabyBloom/Resources/Localization). This MUST live in `sources` with
      # buildPhase: resources — XcodeGen has no target-level `resources` key,
      # build phases are driven purely by the `sources` scan. A DISTINCT path
      # outside any other scanned source root is required so XcodeGen does not
      # dedupe the file references with the app target; otherwise the .appex
      # gets NO Resources build phase and the widget renders raw i18n keys.
      - path: WidgetResources/Localization
        buildPhase: resources
      # Widget-side copy of the brand colorsets, kept in step with the app's
      # catalog by the pre-build script. It CANNOT simply reference
      # BabyBloom/Resources/Assets.xcassets: that path is inside the tree the
      # app target already scans, and XcodeGen then dedupes the file
      # references and ships an .appex with no Resources build phase at all —
      # the same trap the localization JSONs are laid out to avoid.
      - path: WidgetResources/Colors.xcassets
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nenita.app.widget
      INFOPLIST_FILE: BabyBloomWidget/Info.plist
      SWIFT_VERSION: 6.0
      CODE_SIGN_STYLE: Automatic
    entitlements:
      path: BabyBloomWidget/BabyBloomWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nenita.app
    dependencies: []

  BabyBloomTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BabyBloomTests
        excludes:
          - "**/.DS_Store"
      # The same local store the scheme runs the app against, copied into the
      # TEST bundle: SKTestSession(configurationFileNamed:) resolves the name
      # against the bundle it is called from, so the tests would not find the
      # scheme's copy. One file, two consumers, no second source of truth.
      - path: Nenita.storekit
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nenita.app.tests
      SWIFT_VERSION: 6.0
      GENERATE_INFOPLIST_FILE: YES
      # StoreKitTest lives beside XCTest in the platform's Developer
      # frameworks, not in the SDK's System/Library/Frameworks. Without this
      # the bundle links but the test host cannot load it at launch, and the
      # run dies as "Failed to establish communication with the test runner".
      ENABLE_TESTING_SEARCH_PATHS: YES
    dependencies:
      - target: BabyBloom
      # StoreKitTest is a TEST-ONLY SDK framework — it drives purchases without
      # an Apple ID or a sandbox account. It must never reach the app target.
      - sdk: StoreKitTest.framework

# Top level, a sibling of `targets:`. This block used to sit inside the
# BabyBloom target, where XcodeGen silently ignores it — schemes were being
# created implicitly by Xcode instead, so nothing here took effect.
schemes:
  BabyBloom:
    build:
      targets:
        BabyBloom: all
    run:
      config: Debug
      # Local StoreKit products so the paywall renders on the simulator, where
      # there is no App Store Connect to fetch them from.
      storeKitConfiguration: Nenita.storekit
    test:
      config: Debug
      # The test host must run against the SAME local store as the app, or
      # StoreKit in that process talks to the real App Store: SKTestSession
      # reports `notEntitled` and `Product.purchase()` never returns, because
      # it is waiting for a "Sign in to Apple Account" sheet nothing can tap.
      #
      # It has to travel in a TEST PLAN. `storeKitConfiguration:` under this
      # `test:` action is one of XcodeGen's silently-dropped keys — it emits
      # the reference into LaunchAction only, and the generated TestAction
      # carries none.
      #
      # CAVEAT: BabyBloom.xctestplan names its targets by the pbxproj UUIDs
      # XcodeGen generates. Those are deterministic from the target NAMES, so
      # they are stable in practice — but rename a target and the plan silently
      # points at nothing. If a rename ever happens, re-read the identifiers
      # out of the regenerated .xcscheme and update the plan.
      testPlans:
        - path: BabyBloom.xctestplan
          defaultPlan: true
      targets:
        - BabyBloomTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
