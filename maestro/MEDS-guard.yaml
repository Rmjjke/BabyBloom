# The calm confirmation. A dose inside the interval asks first, naming both
# times; Cancel returns to the sheet with what was typed, Save keeps exactly
# one dose. A dose on time saves with no alert. The Add Event form with a
# medication chosen asks the same way.
#
# Seed medsTwoCourses with the clock pinned (-BBNow 10:00): Paracetamol every
# 6 h, at most 4 in 24 h, its latest dose at 8:00 AM and 4 doses in the last
# 24 hours; Vitamin D every 24 h, its latest 26 h ago.
#
# Launch-argument mechanics are explained in SMOKE-main-tabs.yaml.
appId: com.nenita.app
tags: [regression]
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      "-BBSkipSplash": "true"
      "-hasCompletedOnboarding": "true"
      "-appLanguage": "en"
      "-BBSeedScenario": "medsTwoCourses"
      "-BBNow": "2026-11-03T10:00:00"
- extendedWaitUntil:
    visible:
      id: "tab_home"
    timeout: 20000
- tapOn:
    text: "More"
    childOf:
      text: "Tab Bar"
- tapOn:
    id: "more.medications"
- tapOn: "Paracetamol"
- extendedWaitUntil:
    visible: "Last dose at 8:00.AM.· 2.h ago"
    timeout: 10000
- assertVisible: "Last 24.hours: 4.doses of the 4 you set"

# Inside the interval: the alert names the last dose and the next time.
- tapOn:
    id: "medication.log_dose"
- extendedWaitUntil:
    visible:
      id: "dose.save"
    timeout: 10000
- tapOn:
    id: "dose.note"
- inputText: "after food"
- tapOn:
    id: "dose.save"
- extendedWaitUntil:
    visible: "Less than 6.h since the last dose"
    timeout: 10000
- assertVisible: "(?s)Paracetamol.Last dose at 8:00.AM.Next dose not before 2:00.PM"
- takeScreenshot: ${OUT}-guard-before

# Cancel: back on the sheet with the note as typed, nothing saved.
- tapOn: "Cancel"
- assertNotVisible: "Less than 6.h since the last dose"
- assertVisible:
    id: "dose.save"
- assertVisible: "after food"

# Save: one dose is kept and the screen counts from it.
- tapOn:
    id: "dose.save"
- extendedWaitUntil:
    visible: "Less than 6.h since the last dose"
    timeout: 10000
- assertVisible: "(?s)Paracetamol.Last dose at 8:00.AM.Next dose not before 2:00.PM"
# While the alert is up it is all the tree holds, so its Save is the only one.
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Last dose at 10:00.AM.· just now"
    timeout: 10000
- assertNotVisible:
    id: "dose.save"
- assertVisible: "Last 24.hours: 5.doses of the 4 you set"
- takeScreenshot: ${OUT}-guard-saved

# On time: Vitamin D's interval has passed, so the dose saves at once.
- tapOn:
    id: "BackButton"
- tapOn: "Vitamin D"
- tapOn:
    id: "medication.log_dose"
- extendedWaitUntil:
    visible:
      id: "dose.save"
    timeout: 10000
- tapOn:
    id: "dose.save"
- extendedWaitUntil:
    visible: "Last dose at 10:00.AM.· just now"
    timeout: 10000
- assertNotVisible: "Less than .*"
- assertNotVisible: "With this dose.*"

# The Add Event form (creating events is Premium) with Paracetamol chosen.
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      "-BBSkipSplash": "true"
      "-hasCompletedOnboarding": "true"
      "-appLanguage": "en"
      "-BBSeedScenario": "medsTwoCourses"
      "-BBNow": "2026-11-03T10:00:00"
      "-BBForcePremium": "true"
- extendedWaitUntil:
    visible:
      id: "tab_home"
    timeout: 20000
- tapOn:
    text: "More"
    childOf:
      text: "Tab Bar"
- tapOn:
    id: "more.events"
- extendedWaitUntil:
    visible:
      id: "events.quick.medication"
    timeout: 10000
# The toolbar's plus has no label of its own to tap by.
- tapOn:
    point: "92%,8%"
- extendedWaitUntil:
    visible:
      id: "event.type.medication"
    timeout: 10000
- tapOn:
    id: "event.type.medication"
- tapOn:
    id: "medication.picker"
- tapOn: "Paracetamol"
- extendedWaitUntil:
    visible: "Next dose not before 2:00.PM"
    timeout: 5000
- tapOn:
    id: "event.save"
- extendedWaitUntil:
    visible: "Less than 6.h since the last dose"
    timeout: 10000
- assertVisible: "(?s)Paracetamol.Last dose at 8:00.AM.Next dose not before 2:00.PM"
- tapOn: "Cancel"
- assertVisible:
    id: "event.save"
- tapOn:
    id: "event.save"
- extendedWaitUntil:
    visible: "Less than 6.h since the last dose"
    timeout: 10000
- tapOn: "Save"
# Back on Events, Paracetamol's line counts from the new dose.
- extendedWaitUntil:
    visible: "Next dose not before 8:00.PM"
    timeout: 10000
- assertNotVisible:
    id: "event.save"
- takeScreenshot: ${OUT}-guard-form-saved
