# The three ways something leaves a medication: Delete Dose in the dose
# sheet, a swipe on the dose list, and Delete Medication in the form. Each
# leaves the screen it was on with no stale row, and the app keeps running.
#
# Seed medsTwoCourses with the clock pinned (-BBNow 10:00): Paracetamol every
# 6 h, its latest doses at 08:00 and 02:00 today and 20:00 yesterday.
# Deleting the first two moves "Last dose at" back one dose each time.
#
# The app's times and its pickers follow the device's 12/24-hour setting;
# the launch arguments -AppleICUForce24HourTime YES and
# -AppleICUForce12HourTime NO pin it to 24 hours for this app (the second
# overrides a device set to 12 hours), so the times below read the same on
# any simulator.
#
# Launch-argument mechanics are explained in SMOKE-main-tabs.yaml.
appId: com.nenita.app
tags: [regression]
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      "-BBSkipSplash": "true"
      "-hasCompletedOnboarding": "true"
      "-appLanguage": "en"
      "-AppleICUForce24HourTime": "YES"
      "-AppleICUForce12HourTime": "NO"
      "-BBSeedScenario": "medsTwoCourses"
      "-BBNow": "2026-11-03T10:00:00"
- extendedWaitUntil:
    visible:
      id: "tab_home"
    timeout: 20000
- tapOn:
    text: "More"
    childOf:
      text: "Tab Bar"
- tapOn:
    id: "more.medications"
- tapOn: "Paracetamol"
- extendedWaitUntil:
    visible: "Last dose at 08:00.· 2.h ago"
    timeout: 10000

# Delete Dose in the sheet: the 08:00 dose goes, 02:00 is the last.
- tapOn:
    id: "medication.dose.1"
- extendedWaitUntil:
    visible:
      id: "dose.delete"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "dose.delete"
- tapOn:
    id: "dose.delete"
- extendedWaitUntil:
    visible: "Last dose at 02:00.· the 6.h interval has passed"
    timeout: 10000
- assertNotVisible:
    id: "dose.delete"

# A swipe on the list: the 02:00 dose goes, yesterday's 20:00 is the last.
- swipe:
    from:
      id: "medication.dose.1"
    direction: LEFT
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Last dose at 20:00 yesterday.· the 6.h interval has passed"
    timeout: 10000

# The row that is now first opens its own dose, not a deleted one.
- tapOn:
    id: "medication.dose.1"
- extendedWaitUntil:
    visible:
      id: "dose.time"
    timeout: 10000
- tapOn: "Cancel"

# Delete Medication: the form asks, the screen pops, the medication goes.
# Centred: under the reminder card the button can sit behind the pinned Save,
# where the tree still calls it visible and a tap lands on Save.
- tapOn:
    id: "medication.edit"
- scrollUntilVisible:
    element:
      id: "medication.delete"
    centerElement: true
- tapOn:
    id: "medication.delete"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Vitamin D"
    timeout: 10000
- assertNotVisible: "Paracetamol"
