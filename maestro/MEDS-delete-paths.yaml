# The three ways something leaves a medication: Delete Dose in the dose
# sheet, a swipe on the dose list, and Delete Medication in the form. Each
# leaves the screen it was on with no stale row, and the app keeps running.
#
# Seed medsTwoCourses with the clock pinned (-BBNow 10:00): Paracetamol every
# 6 h, its latest doses at 8:00 AM and 2:00 AM today and 8:00 PM yesterday.
# Deleting the first two moves "Last dose at" back one dose each time.
#
# Launch-argument mechanics are explained in SMOKE-main-tabs.yaml.
appId: com.nenita.app
tags: [regression]
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      "-BBSkipSplash": "true"
      "-hasCompletedOnboarding": "true"
      "-appLanguage": "en"
      "-BBSeedScenario": "medsTwoCourses"
      "-BBNow": "2026-11-03T10:00:00"
- extendedWaitUntil:
    visible:
      id: "tab_home"
    timeout: 20000
- tapOn:
    text: "More"
    childOf:
      text: "Tab Bar"
- tapOn:
    id: "more.medications"
- tapOn: "Paracetamol"
- extendedWaitUntil:
    visible: "Last dose at 8:00.AM · 2.h ago"
    timeout: 10000

# Delete Dose in the sheet: the 8:00 AM dose goes, 2:00 AM is the last.
- tapOn:
    id: "medication.dose.1"
- extendedWaitUntil:
    visible:
      id: "dose.delete"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "dose.delete"
- tapOn:
    id: "dose.delete"
- extendedWaitUntil:
    visible: "Last dose at 2:00.AM · the 6.h interval has passed"
    timeout: 10000
- assertNotVisible:
    id: "dose.delete"

# A swipe on the list: the 2:00 AM dose goes, yesterday's 8:00 PM is the last.
- swipe:
    from:
      id: "medication.dose.1"
    direction: LEFT
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Last dose at 8:00.PM yesterday · the 6.h interval has passed"
    timeout: 10000

# The row that is now first opens its own dose, not a deleted one.
- tapOn:
    id: "medication.dose.1"
- extendedWaitUntil:
    visible:
      id: "dose.time"
    timeout: 10000
- tapOn: "Cancel"

# Delete Medication: the form asks, the screen pops, the medication goes.
- tapOn:
    id: "medication.edit"
- scrollUntilVisible:
    element:
      id: "medication.delete"
- tapOn:
    id: "medication.delete"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Vitamin D"
    timeout: 10000
- assertNotVisible: "Paracetamol"
