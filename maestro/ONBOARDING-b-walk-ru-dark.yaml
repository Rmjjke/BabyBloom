# Stream B walk (ru, dark): same flow, and the "Не сейчас" branch — which
# raises no system alert at all and advances immediately.
#
# Page order (growth showcase inserted 2026-09-21): Welcome → Name → Birth →
# Feeding → Growth → Fact → Growth showcase → Notifications → Widget →
# Generating → Premium. «Создать мой трекер» is the WIDGET page's CTA; the Fact
# page and the showcase page both end with a plain «Далее».
appId: com.nenita.app
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      "-BBSkipSplash": "true"
      "-appLanguage": "ru"
      "-appAppearance": "dark"

- extendedWaitUntil: { visible: "Начать", timeout: 20000 }
- tapOn: "Начать"
# See the en walk: wait for the Name page before tapping its field.
- extendedWaitUntil: { visible: "Имя ребёнка", timeout: 20000 }
- tapOn: "Имя ребёнка"
- inputText: "Мия"
- pressKey: Enter
- tapOn: "Далее"
- tapOn: "Далее"
- tapOn: "Далее"
- tapOn: "Далее"

# Fact page — its CTA is «Далее» as well, so anchor on the page's own badge.
- extendedWaitUntil: { visible: "Знали ли вы?", timeout: 20000 }
- takeScreenshot: 05-fact-ru-dark
- tapOn: "Далее"

# Growth showcase — «Далее» again, so anchor on the page's own title. 3.50 кг is
# the measurements page's untouched default: asserting it is what proves the
# card is fed the parent's REAL answer rather than drawn from a fixture.
- extendedWaitUntil: { visible: ".*по стандартам ВОЗ.*", timeout: 20000 }
- assertVisible: "Перцентили ВОЗ"
- assertVisible: ".*Мия при рождении: 3.50.*"
- assertVisible: ".*настоящая кривая появится по вашим взвешиваниям.*"
- assertVisible: ".*где Мия среди сверстников.*"
- takeScreenshot: 05b-showcase-ru-dark
- tapOn: "Далее"

- extendedWaitUntil: { visible: "Включить уведомления", timeout: 20000 }
- assertVisible: ".*Мия ест и спит.*"
- assertVisible: ".*подстраивается под ваш ритм.*"
- assertVisible: ".*окно бодрствования.*"
- assertVisible: ".*Без спама.*"
- takeScreenshot: 06-notify-ru-dark

# The secondary button: no dialog at all, straight to the widget page.
- tapOn: "Не сейчас"
- extendedWaitUntil: { visible: "Виджет на домашнем экране", timeout: 20000 }
- assertNotVisible: "Разрешить"
- assertVisible: "Мия"
- assertVisible: ".*Долгое нажатие на домашний экран.*Ночка.*"
- assertVisible: "Создать мой трекер"
- takeScreenshot: 07-widget-ru-dark
- tapOn: "Создать мой трекер"

# Generating runs here — self-advancing — and lands DIRECTLY on the paywall.
# The discriminator is the paywall's `onboarding.premium.afterGenerating`,
# set only by the loader's completion (see the en walk's note for why the
# loader itself cannot be asserted without a race).
- extendedWaitUntil: { visible: { id: "onboarding.premium.afterGenerating" }, timeout: 40000 }
- extendedWaitUntil: { visible: "Ночка Premium", timeout: 40000 }
- takeScreenshot: 08-premium-ru-dark
- extendedWaitUntil: { visible: "Закрыть", timeout: 20000 }
- tapOn: "Закрыть"

- extendedWaitUntil: { visible: { id: "tab_home" }, timeout: 20000 }
- assertVisible: "Добро пожаловать в Ночку"
- assertVisible: "Мия"
- assertNotVisible: "Разрешить"
- takeScreenshot: 09-dashboard-no-dialog-ru-dark
