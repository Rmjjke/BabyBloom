# Home's medication card: shown while a course runs and its last dose is
# under a day old; one medication opens its detail, two open the list; gone
# a day after the last dose. On the way, a dose logged from the card's detail
# moves the pending reminder.
#
# Seed medsTwoCourses with the clock pinned (-BBNow 10:00): Paracetamol every
# 6 h, at most 4 in 24 h, latest dose 8:00 AM; Vitamin D every 24 h, latest
# 26 h ago, so only Paracetamol is on Home at first.
#
# The reminder switch is tapped by point (84%,58%, iPhone 17, default size,
# English): a tap on a Toggle's label does not flip it.
#
# Launch-argument mechanics are explained in SMOKE-main-tabs.yaml.
appId: com.nenita.app
tags: [regression]
---
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      "-BBSkipSplash": "true"
      "-hasCompletedOnboarding": "true"
      "-appLanguage": "en"
      "-BBSeedScenario": "medsTwoCourses"
      "-BBNow": "2026-11-03T10:00:00"
      "-BBLogPendingNotifications": "true"
- extendedWaitUntil:
    visible:
      id: "home.medications"
    timeout: 20000
- assertVisible: "(?s).*Paracetamol.*Next dose not before 2:00.PM.*"
- assertNotVisible: ".*Vitamin D.*"
- takeScreenshot: ${OUT}-one

# One medication: the card opens its detail.
- tapOn:
    id: "home.medications"
- extendedWaitUntil:
    visible:
      id: "medication.log_dose"
    timeout: 10000
- assertVisible: "Paracetamol"

# Reminder on, then a dose: the pending time moves to the screen's new one.
- tapOn:
    point: "84%,58%"
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: "Notification: 2:00.PM"
    timeout: 10000
- tapOn:
    id: "medication.log_dose"
- extendedWaitUntil:
    visible:
      id: "dose.save"
    timeout: 10000
- tapOn:
    id: "dose.save"
- extendedWaitUntil:
    notVisible:
      id: "dose.save"
    timeout: 10000
# While the alert is up it is all the tree holds, so its Save is the only one.
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Notification: 8:00.PM"
    timeout: 10000
- takeScreenshot: ${OUT}-moved

# A Vitamin D dose puts a second line on the card, which then opens the list.
- tapOn:
    text: "More"
    childOf:
      text: "Tab Bar"
- tapOn:
    id: "more.medications"
- tapOn: "Vitamin D"
- tapOn:
    id: "medication.log_dose"
- extendedWaitUntil:
    visible:
      id: "dose.save"
    timeout: 10000
- tapOn:
    id: "dose.save"
- extendedWaitUntil:
    visible: "Last dose at 10:00.AM.· just now"
    timeout: 10000
- tapOn:
    text: "Home"
    childOf:
      text: "Tab Bar"
# Home's own stack still holds the detail the card opened.
- tapOn:
    id: "BackButton"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home.medications"
    timeout: 10000
- assertVisible: "(?s).*Paracetamol.*Next dose not before 8:00.PM.*Vitamin D.*Next dose not before 10:00.AM tomorrow.*"
- takeScreenshot: ${OUT}-two
- tapOn:
    id: "home.medications"
- extendedWaitUntil:
    visible: "Active"
    timeout: 10000

# A day and more after the last doses: the card is gone.
- launchApp:
    stopApp: true
    arguments:
      "-BBSkipSplash": "true"
      "-hasCompletedOnboarding": "true"
      "-appLanguage": "en"
      "-BBNow": "2026-11-04T12:00:00"
- extendedWaitUntil:
    visible:
      id: "tab_home"
    timeout: 20000
- assertNotVisible:
    id: "home.medications"
- takeScreenshot: ${OUT}-gone
